<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #eef1f5;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 640px;
            height: 100dvh;
            max-height: 800px;
            background: #fff;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        @media (max-width: 680px) {
            .chat-container { max-height: none; border-radius: 0; }
        }

        /* Header */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: #2563eb;
            color: #fff;
        }
        .chat-header h2 { font-size: 18px; font-weight: 600; }
        .chat-header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }
        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #f87171;
            margin-right: 5px;
        }
        .status-dot.online { background: #4ade80; }
        .logout-btn {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .logout-btn:hover { background: rgba(255, 255, 255, 0.3); }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f8fafc;
        }
        .empty-note {
            margin: auto;
            color: #94a3b8;
            font-size: 14px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }
        .message.mine { align-self: flex-end; align-items: flex-end; }
        .message.theirs { align-self: flex-start; align-items: flex-start; }

        .sender {
            font-size: 12px;
            color: #64748b;
            margin: 0 8px 3px;
        }
        .bubble {
            padding: 9px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }
        .mine .bubble {
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .theirs .bubble {
            background: #e2e8f0;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }
        .time {
            font-size: 11px;
            color: #94a3b8;
            margin: 3px 8px 0;
        }

        /* Input bar */
        .input-bar {
            display: flex;
            gap: 10px;
            padding: 12px 14px;
            border-top: 1px solid #e2e8f0;
            background: #fff;
        }
        .input-bar input {
            flex: 1;
            padding: 11px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
        }
        .input-bar input:focus { border-color: #2563eb; }
        .input-bar button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 0 22px;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
        }
        .input-bar button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div>
                <h2>Chat room</h2>
                <div class="sub">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="status-text">Connecting...</span>
                    &middot; {{ user.username }}
                </div>
            </div>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>

        <div id="messages" class="messages">
            <div id="empty-note" class="empty-note">No messages yet. Say hello!</div>
        </div>

        <div class="input-bar">
            <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" autofocus>
            <button id="send">Send</button>
        </div>
    </div>

    {{ user.username|json_script:"current-user" }}

    <script>
        const currentUser = JSON.parse(document.getElementById('current-user').textContent);
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const socket = new WebSocket(protocol + window.location.host + '/ws/chat/');

        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('message-input');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        socket.onopen = function () {
            statusDot.classList.add('online');
            statusText.textContent = 'Connected';
        };

        socket.onclose = function () {
            statusDot.classList.remove('online');
            statusText.textContent = 'Disconnected';
        };

        socket.onmessage = function (e) {
            addMessage(JSON.parse(e.data));
        };

        function addMessage(data) {
            const emptyNote = document.getElementById('empty-note');
            if (emptyNote) emptyNote.remove();

            const isMine = data.username === currentUser;

            const wrapper = document.createElement('div');
            wrapper.className = 'message ' + (isMine ? 'mine' : 'theirs');

            if (!isMine) {
                const sender = document.createElement('div');
                sender.className = 'sender';
                sender.textContent = data.username;
                wrapper.appendChild(sender);
            }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = data.message;
            wrapper.appendChild(bubble);

            const time = document.createElement('div');
            time.className = 'time';
            time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            wrapper.appendChild(time);

            messagesDiv.appendChild(wrapper);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const message = input.value.trim();
            if (!message || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify({ message: message }));
            input.value = '';
            input.focus();
        }

        document.getElementById('send').onclick = sendMessage;
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
