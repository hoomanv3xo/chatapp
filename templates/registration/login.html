<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #eef1f5;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            padding: 32px 28px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
        }
        h2 { margin-bottom: 20px; color: #1e293b; }
        form p { margin-bottom: 14px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 14px; color: #475569; }
        input[type="text"], input[type="password"] {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #2563eb; }
        .helptext, ul.errorlist {
            font-size: 12px;
            color: #64748b;
            list-style: none;
        }
        ul.errorlist { color: #dc2626; }
        button {
            width: 100%;
            padding: 11px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 6px;
        }
        button:hover { background: #1d4ed8; }
        .switch { margin-top: 16px; font-size: 14px; color: #64748b; text-align: center; }
        .switch a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p class="switch">No account? <a href="{% url 'signup' %}">Sign up</a></p>
    </div>
</body>
</html>
